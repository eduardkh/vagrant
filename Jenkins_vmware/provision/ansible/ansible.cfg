# MILESTONE 2: local controller plus SSH Linux agent; Windows comes later.
[defaults]
inventory = /vagrant/ansible/inventory.yaml
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/local/bin/python3

[ssh_connection]
ssh_args = -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/vagrant/.ssh/jenkins_lab_known_hosts
pipelining = True
